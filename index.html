<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>with-awai 練習場</title>
<style>
  :root { --ink: #1f1d27; --sub: #6b6576; --line: #e0d8c8; --accent: #c98a2b; --bg: #fbf9f4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; }
  .eyebrow { margin: 0; font-size: 13px; letter-spacing: .08em; color: #8a6d3b; font-weight: 600; }
  h1 { margin: 4px 0 8px; font-size: 26px; }
  p.lead { margin: 0 0 24px; color: var(--sub); }
  h2 { font-size: 17px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin: 28px 0 12px; }
  ul.apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  ul.apps li a {
    display: block; padding: 12px 16px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 600;
  }
  ul.apps li a:hover { border-color: var(--accent); }
  ul.apps li.empty { color: var(--sub); font-size: 14px; padding: 12px 16px; border: 1px dashed var(--line); border-radius: 10px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--sub); background: #fff; border-left: 3px solid var(--accent); padding: 8px 12px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">with-awai</p>
  <h1>練習場</h1>
  <p class="lead">Claude Code に頼んで作った小さなアプリを、ここに並べていきます。</p>

  <h2>つくったもの</h2>
  <ul class="apps">
    <li class="empty">まだありません。最初の1つを作ってみましょう。</li>
  </ul>

  <p class="note">このページは誰でも見られます。お店の名前・人の名前・合言葉は書かないでください。</p>
</main>
</body>
</html>
