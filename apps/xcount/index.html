<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>X 投稿の文字数チェック</title>
<style>
  :root { --ink: #1f1d27; --sub: #6b6576; --line: #e0d8c8; --accent: #c98a2b; --bg: #fbf9f4; --over: #c62828; --over-bg: #fdecea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; }
  a.back { font-size: 13px; color: var(--sub); }
  h1 { margin: 8px 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
  textarea {
    width: 100%; min-height: 200px; padding: 12px; font: inherit; font-size: 16px;
    background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 10px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .counter { margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .count { font-size: 28px; font-weight: 700; }
  .count small { font-size: 15px; color: var(--sub); font-weight: 400; }
  .msg { font-size: 14px; color: var(--sub); }
  .over textarea { border-color: var(--over); background: var(--over-bg); }
  .over .count, .over .msg { color: var(--over); }
  button {
    margin-top: 12px; padding: 8px 16px; font: inherit; font-size: 14px;
    background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>
<main id="box">
  <a class="back" href="../../">← 練習場にもどる</a>
  <h1>X 投稿の文字数チェック</h1>
  <p class="lead">下書きを貼りつけると文字数を数えます。140字を超えると赤くなります。</p>

  <textarea id="text" placeholder="ここに投稿の下書きを貼りつけてください"></textarea>

  <div class="counter">
    <div class="count"><span id="num">0</span><small> / 140字</small></div>
    <div class="msg" id="msg">あと140字書けます</div>
  </div>
  <button type="button" id="clear">消す</button>
</main>
<script>
  const LIMIT = 140;
  const box = document.getElementById('box');
  const text = document.getElementById('text');
  const num = document.getElementById('num');
  const msg = document.getElementById('msg');

  // 絵文字や結合文字も見た目どおり1字として数える
  const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'grapheme' }) : null;
  function countChars(s) {
    return seg ? Array.from(seg.segment(s)).length : Array.from(s).length;
  }

  function update() {
    const n = countChars(text.value);
    num.textContent = n;
    const over = n > LIMIT;
    box.classList.toggle('over', over);
    msg.textContent = over ? (n - LIMIT) + '字オーバーしています' : 'あと' + (LIMIT - n) + '字書けます';
  }

  text.addEventListener('input', update);
  document.getElementById('clear').addEventListener('click', () => { text.value = ''; update(); text.focus(); });
  update();
</script>
</body>
</html>
