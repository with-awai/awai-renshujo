<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>X 投稿 文字数カウンター</title>
<style>
  :root { --ink: #1f1d27; --sub: #6b6576; --line: #e0d8c8; --accent: #c98a2b; --bg: #fbf9f4; --over: #c62828; --over-bg: #fdecea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; }
  .back { font-size: 14px; color: var(--sub); }
  h1 { margin: 8px 0 4px; font-size: 24px; }
  p.lead { margin: 0 0 20px; color: var(--sub); font-size: 14px; }
  textarea {
    width: 100%; min-height: 200px; padding: 12px; font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 10px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .count { margin-top: 12px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; }
  .count strong { font-size: 28px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); }
  .msg { margin: 6px 0 0; font-size: 14px; color: var(--sub); }
  body.over textarea { border-color: var(--over); background: var(--over-bg); }
  body.over .count { border-color: var(--over); color: var(--over); }
  body.over .bar span { background: var(--over); }
  body.over .msg { color: var(--over); font-weight: 600; }
  button { margin-top: 12px; padding: 8px 16px; font: inherit; font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← 練習場にもどる</a>
  <h1>X 投稿 文字数カウンター</h1>
  <p class="lead">下書きを貼り付けると文字数を数えます。140字を超えると赤くなります。</p>

  <textarea id="text" placeholder="ここに投稿の下書きを貼り付けてください"></textarea>

  <div class="count">
    <strong id="num">0</strong> / 140字
    <div class="bar"><span id="bar"></span></div>
    <p class="msg" id="msg">あと140字書けます。</p>
  </div>

  <button type="button" id="clear">消す</button>
</main>
<script>
  const LIMIT = 140;
  const text = document.getElementById('text');
  const num = document.getElementById('num');
  const bar = document.getElementById('bar');
  const msg = document.getElementById('msg');

  // 絵文字なども見た目どおり1文字として数える
  const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'grapheme' }) : null;
  function countChars(s) {
    return segmenter ? Array.from(segmenter.segment(s)).length : Array.from(s).length;
  }

  function update() {
    const n = countChars(text.value);
    num.textContent = n;
    bar.style.width = Math.min(n / LIMIT, 1) * 100 + '%';
    const over = n > LIMIT;
    document.body.classList.toggle('over', over);
    msg.textContent = over ? (n - LIMIT) + '字オーバーしています。' : 'あと' + (LIMIT - n) + '字書けます。';
  }

  text.addEventListener('input', update);
  document.getElementById('clear').addEventListener('click', () => { text.value = ''; update(); text.focus(); });
</script>
</body>
</html>
